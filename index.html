<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설홍 노래 가챠 슬롯머신</title>
<style>
:root{
  --bg:#0d1223; --panel:#20294a; --panel2:#12182d; --text:#fff;
  --muted:#aeb6d3; --pink:#ff7eb8; --cyan:#77e6ff; --gold:#ffd36e;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:
  radial-gradient(circle at 20% 10%,rgba(119,230,255,.12),transparent 25%),
  radial-gradient(circle at 80% 10%,rgba(255,126,184,.14),transparent 25%),
  linear-gradient(135deg,#0a1020,#20112b);
  color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif
}
.wrap{max-width:1120px;margin:auto;padding:36px 20px 56px}
h1{text-align:center;font-size:48px;margin:0 0 8px}
.sub{text-align:center;color:var(--muted);margin-bottom:16px}
.status{max-width:820px;margin:0 auto 24px;padding:12px 16px;border:1px solid rgba(255,255,255,.15);
border-radius:14px;background:rgba(255,255,255,.04);text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
.status.ok{color:#8ff1c9;border-color:rgba(143,241,201,.35)}
.status.warn{color:#ffd98b;border-color:rgba(255,217,139,.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{--accent:var(--pink);background:linear-gradient(180deg,#28345e,#20294a);border-radius:24px;padding:22px;
border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card.haegeum{--accent:var(--cyan)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h2{margin:0;font-size:23px}
.count{font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.13);padding:6px 9px;border-radius:999px}
.slot{height:170px;border-radius:18px;background:#080d1e;display:grid;place-items:center;padding:18px;overflow:hidden;
box-shadow:inset 0 18px 25px rgba(0,0,0,.6),inset 0 -18px 25px rgba(0,0,0,.6)}
.result{font-size:clamp(22px,3vw,32px);font-weight:900;text-align:center;line-height:1.35;word-break:keep-all;
text-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;font-size:18px;font-weight:900;
cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--gold));color:#080a12}
button:disabled{opacity:.55;cursor:not-allowed}
.spinning .result{animation:shake .08s linear infinite;filter:blur(1px)}
.winner .result{animation:pop .45s cubic-bezier(.2,.9,.2,1.3)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}
@keyframes shake{0%{transform:translateY(-6px)}50%{transform:translateY(6px)}100%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.75);opacity:.2}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}

.sheet-link-wrap{
  margin-top:24px;
  text-align:center;
}
.sheet-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:220px;
  padding:14px 22px;
  border-radius:14px;
  text-decoration:none;
  font-weight:900;
  color:#09101d;
  background:linear-gradient(135deg,#8ff1c9,#70e7ff);
  box-shadow:0 12px 30px rgba(112,231,255,.22);
  transition:.16s ease;
}
.sheet-link:hover{
  transform:translateY(-2px);
  filter:brightness(1.07);
}
.sheet-link:active{
  transform:translateY(1px) scale(.99);
}

@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:36px}}
</style>
</head>

<div class="wrap">
  <h1>설홍 노래 가챠 슬롯머신</h1>
  <div class="sub">지금까지 아씨께서 하신 노래의 목록으로 작성되었습니다</div>

  <div class="grid">
    <section class="card" id="songCard">

      <div class="slot"><div id="songResult" class="result">버튼을 눌러 추첨하세요</div></div>
      <button id="songBtn">랜덤 노래 가챠 돌리기</button>
    </section>

    <section class="card haegeum" id="haeCard">

      <button id="haeBtn">랜덤 해금 가챠 돌리기</button>
    </section>
  </div>


  <div class="sheet-link-wrap">

  </div>
</div>

function randomIndex(n){
  if(n<=1)return 0;
  const max=Math.floor(0x100000000/n)*n;
  const a=new Uint32Array(1);
  do crypto.getRandomValues(a); while(a[0]>=max);
  return a[0]%n;
}

function playTick(ctx, when, freq, duration, gain=0.06){
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(freq,when);
  g.gain.setValueAtTime(gain,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+duration);
  o.connect(g).connect(ctx.destination);
  o.start(when);o.stop(when+duration);
}

function playWin(ctx){
  const now=ctx.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>playTick(ctx,now+i*0.08,f,0.16,0.08));
}

function roll(list,resultId,cardId,buttonId){
  const result=document.getElementById(resultId);
  const card=document.getElementById(cardId);
  const button=document.getElementById(buttonId);
  if(!list.length)return;

  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  const ctx=new AudioCtx();
  ctx.resume();

  button.disabled=true;
  card.classList.remove("winner");
  card.classList.add("spinning");

  let ticks=0;
  const maxTicks=16; // 기존 약 1.8초의 절반 수준
  let delay=28;

  const step=()=>{
    result.textContent=list[randomIndex(list.length)];
    playTick(ctx,ctx.currentTime,180+ticks*18,0.035,0.045);
    ticks++;
    if(ticks<maxTicks){
      delay=Math.min(80,delay*1.09);
      setTimeout(step,delay);
      return;
    }
    result.textContent=list[randomIndex(list.length)];
    card.classList.remove("spinning");
    void card.offsetWidth;
    card.classList.add("winner");
    playWin(ctx);
    button.disabled=false;
    setTimeout(()=>ctx.close(),500);
  };
  step();
}

document.getElementById("songBtn").onclick=()=>roll(songList,"songResult","songCard","songBtn");
document.getElementById("haeBtn").onclick=()=>roll(haeList,"haeResult","haeCard","haeBtn");

function parseGviz(text){
  const m=text.match(/setResponse\((.*)\);?\s*$/s);
  if(!m)throw new Error("응답 형식을 해석하지 못했습니다.");
  return JSON.parse(m[1]);
}

async function tryLoadLive(){
  const status=document.getElementById("status");
  const q=encodeURIComponent("select B,C,F,G offset 1 limit 998");
  const url=`https://docs.google.com/spreadsheets/d/e/${PUB_ID}/gviz/tq?tqx=out:json&tq=${q}`;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),7000);

  try{
    const res=await fetch(url,{cache:"no-store",signal:controller.signal});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const text=await res.text();
    const data=parseGviz(text);
    const rows=data.table?.rows||[];
    const liveSongs=[];
    const liveHae=[];

    for(const row of rows){
      const c=row.c||[];
      const b=(c[0]?.v??"").toString().trim();
      const cArtist=(c[1]?.v??"").toString().trim();
      const f=(c[2]?.v??"").toString().trim();
      const gArtist=(c[3]?.v??"").toString().trim();

      if(b)liveSongs.push(cArtist?`${b}-${cArtist}`:b);
      if(f)liveHae.push(gArtist?`${f}-${gArtist}`:f);
    }

    if(!liveSongs.length||!liveHae.length)throw new Error("유효한 최신 데이터를 찾지 못했습니다.");

    songList=liveSongs;
    haeList=liveHae;
    setCounts();
    if(status){
      status.className="status ok";
      status.textContent=`최신 구글 스프레드시트 반영 완료: 노래 ${songList.length}개 · 해금 ${haeList.length}개`;
    }
  }catch(e){
    console.warn("최신 시트 연결 실패. 엑셀 내장 목록으로 실행합니다.", e);
  }finally{
    clearTimeout(timer);
  }
}
tryLoadLive();
